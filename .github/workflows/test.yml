name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Render report
        if: always()
        run: python tools/render_report.py
      - name: Commit latest example report
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/index.html reports/junit.xml
          if git diff --staged --quiet; then
            echo "No report changes"
          else
            git commit -m "chore: refresh generated example report from powertrain_demo.dbc"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-py${{ matrix.python-version }}
          path: |
            reports/junit.xml
            reports/index.html
