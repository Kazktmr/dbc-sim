<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>dbc-sim test report</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 2rem; background: #111; color: #eee; }
    h1 { font-size: 1.4rem; }
    .ok { color: #3dd68c; }
    .fail { color: #ff6b6b; }
    .skip { color: #f5c542; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #333; padding: 0.45rem 0.6rem; text-align: left; font-size: 0.92rem; }
    th { color: #9aa; font-weight: 600; }
    code { font-family: ui-monospace, SFMono-Regular, monospace; }
    .meta { color: #9aa; }
  </style>
</head>
<body>
  <h1>dbc-sim unit test report</h1>
  <p class="meta">Automotive sample DBC: <code>examples/powertrain_demo.dbc</code></p>
  <p>
    Tests: <strong>{{tests}}</strong>
    &nbsp; Passed: <strong class="ok">{{passed}}</strong>
    &nbsp; Failed: <strong class="fail">{{failed}}</strong>
    &nbsp; Skipped: <strong class="skip">{{skipped}}</strong>
    &nbsp; Time: {{time}}s
  </p>
  <table>
    <thead>
      <tr><th>Result</th><th>Case</th><th>Time</th><th>Detail</th></tr>
    </thead>
    <tbody>
      {{rows}}
    </tbody>
  </table>
</body>
</html>
